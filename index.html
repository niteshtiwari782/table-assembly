<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flat-pack Assembly · 3D Guides</title>
  <meta name="description" content="Interactive 3D step-by-step assembly guides for flat-pack furniture: dining table, bookshelf, bed frame, coffee table and L-shaped sofa." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="stage" aria-label="3D view of the table assembly"></div>

  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" id="brandIcon"></svg>
      </div>
      <div>
        <h1 id="brandTitle">Assembly Guide</h1>
        <p id="brandTag">Flat-pack · 3D step-by-step</p>
      </div>
    </div>
    <nav class="picker" id="picker" aria-label="Choose furniture"></nav>
  </header>

  <aside class="panel" id="panel">
    <div class="step-meta">
      <span class="badge" id="stepBadge">Step 0</span>
      <span class="count" id="stepCount"></span>
    </div>
    <h2 id="stepTitle">Parts overview</h2>
    <p id="stepDesc" class="desc"></p>
    <ul id="stepParts" class="parts"></ul>
    <div class="tip" id="stepTip" hidden></div>

    <div class="progress" id="progress" role="tablist" aria-label="Steps"></div>

    <div class="controls">
      <button id="prevBtn" class="btn ghost" aria-label="Previous step">&larr; Back</button>
      <button id="replayBtn" class="btn icon" aria-label="Replay this step" title="Replay step">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <button id="playBtn" class="btn icon" aria-label="Auto-play all steps" title="Auto-play">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="nextBtn" class="btn primary" aria-label="Next step">Next &rarr;</button>
    </div>
    <p class="hint">Drag to rotate · scroll to zoom · ← → keys to navigate</p>
  </aside>

  <footer class="note">Generic flat-pack design for illustration. Not affiliated with any furniture retailer.</footer>

  <div id="loader" class="loader"><span></span>Preparing workshop…</div>

  <script type="module" src="app.js"></script>
</body>
</html>
